name: Dependabot Auto-merge

# Enables auto-merge on Dependabot PRs. Runs in base-branch context via
# pull_request_target, which is safe here because no PR code is checked out
# or executed. The "Require CI" repository ruleset on main holds the merge
# until biome, typecheck, unit-tests and integration-tests pass.
#
# Uses the bje-merge App token (BJE_MERGE_APP_CLIENT_ID/BJE_MERGE_APP_PK),
# NOT GITHUB_TOKEN. GitHub does not create workflow runs from events
# triggered by GITHUB_TOKEN, so an auto-merge enabled with it lands a commit
# on main that triggers nothing downstream, including release.yml, whose
# on:push trigger publishes the `latest` bundle (#123). The App is a distinct
# identity, so merges it enables do trigger on:push workflows.
#
# Approves once before enabling auto-merge. No ruleset on this repo currently
# requires approving reviews, so today this is a no-op. It is here so the
# workflow keeps working unchanged if a `pull_request` rule with
# `required_approving_review_count` is ever added, and to stay consistent
# with the same workflow in other repos.

on: pull_request_target

# contents:read only. The steps below use the App token, never GITHUB_TOKEN,
# and nothing here checks out or executes PR code.
permissions:
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Gate on the PR's AUTHOR, not github.actor. `actor` is whoever triggered
    # this event, so any human push to a Dependabot branch (fixing a lockfile
    # conflict, say) makes it the pusher and skips this job. The PR then
    # silently drops out of auto-merge management, with no error to notice.
    # `pull_request.user.login` is a stable property of the PR and cannot be
    # forged, so it is both the correct check and no weaker as a guard.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Generate bje-merge token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BJE_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.BJE_MERGE_APP_PK }}

      # pull_request_target fires on every push to the branch, so an
      # unconditional approve stacks a duplicate review on each one.
      # `latestReviews` returns at most one review per author and reports a
      # dismissed approval as DISMISSED, so an APPROVED entry for the App is
      # exactly "still approved by us".
      - name: Check for an existing approval
        id: approval
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Reviews from an App are authored by its slug, without the [bot]
          # suffix the REST API adds.
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          approved=$(gh pr view "$PR_URL" --json latestReviews \
            --jq 'any(.latestReviews[]; .author.login == env.APP_SLUG and .state == "APPROVED")')
          echo "approved=$approved" >>"$GITHUB_OUTPUT"

      - name: Approve
        if: steps.approval.outputs.approved != 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr review --approve "$PR_URL"

      - name: Enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge --auto --squash "$PR_URL"
