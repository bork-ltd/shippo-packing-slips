name: Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'yarn.lock'
      - 'tsconfig.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build bundle
        run: yarn build:bundle
      - name: Delete existing latest release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --yes --cleanup-tag || true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          make_latest: true
          # Inter font files (Inter-Regular.ttf, Inter-Bold.ttf) are intentionally
          # excluded — they are sourced directly from rsms/inter during Pi provisioning.
          files: |
            dist/bundle/index.js
            dist/bundle/*.afm
            dist/bundle/sRGB_IEC61966_2_1.icc
